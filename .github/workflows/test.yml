name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Evals (scripted brain)
        if: matrix.node == 22
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: eval-report
          path: evals/report.md
